name: Build & Release

# 推一个 v 开头的 tag（例如 v1.0.0）就会自动打包并发布 Release。
# 也可以在 Actions 页面手动触发（只产出 artifact，不发布 Release）。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Syntax check
        run: python -m py_compile app.py launcher.py

      - name: Smoke test
        env:
          # runner 是英文 Windows（cp1252），不设这个打印中文就 UnicodeEncodeError
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python tests/test_smoke.py

      - name: App test（用真 Streamlit 渲染一遍）
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python tests/test_apptest.py

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean app.spec

      - name: Launch check（打不开就不许发）
        shell: pwsh
        run: |
          $exe = "dist\AI智能伴侣\AI智能伴侣.exe"
          if (-not (Test-Path $exe)) { throw "没找到 exe：$exe" }
          $env:AI_PARTNER_PORT = "8501"
          $env:CI = "true"
          $log = Join-Path $env:RUNNER_TEMP "exe-out.txt"
          $p = Start-Process -FilePath $exe -PassThru `
               -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          $up = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 1
            if ($p.HasExited) { break }
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8501" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $up = $true; break }
            } catch { }
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (-not $up) {
            Write-Host "---- exe stdout ----"
            Get-Content $log -ErrorAction SilentlyContinue
            Write-Host "---- exe stderr ----"
            Get-Content "$log.err" -ErrorAction SilentlyContinue
            throw "exe 启动后没能在 8501 端口返回页面，这个包发出去用户也打不开"
          }
          Write-Host "OK：exe 启动正常，http://127.0.0.1:8501 返回 200"

      - name: Bundle launchers and docs
        shell: pwsh
        run: |
          # 启动验证会生成 sessions/ 和各种日志，别把它们塞进发布包
          Remove-Item dist\AI智能伴侣\sessions -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item dist\AI智能伴侣\config.json -Force -ErrorAction SilentlyContinue
          Remove-Item dist\AI智能伴侣\运行日志.txt -Force -ErrorAction SilentlyContinue
          Remove-Item dist\AI智能伴侣\当前地址.txt -Force -ErrorAction SilentlyContinue
          Remove-Item dist\AI智能伴侣\启动日志.txt -Force -ErrorAction SilentlyContinue
          Copy-Item packaging\*.bat dist\AI智能伴侣\ -Force
          Copy-Item packaging\*.ps1 dist\AI智能伴侣\ -Force
          Copy-Item assets\app.ico dist\AI智能伴侣\ -Force
          Copy-Item docs\使用说明.md dist\AI智能伴侣\ -Force
          Get-ChildItem dist\AI智能伴侣 | Select-Object Name, Length

      - name: Build window host（自带 WebView2 小窗口）
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build_window_host.ps1 -Python python
          if (-not (Test-Path "assets\window_host\AI伴侣窗口.exe")) {
            throw "窗口宿主没编译出来（用户双击后只会看到浏览器标签页）"
          }
          Copy-Item assets\window_host\* dist\AI智能伴侣\ -Force

      - name: Verify final bundle（打包前的最后一道闸）
        run: python scripts/verify_bundle.py

      - name: Create zip
        shell: pwsh
        run: |
          $zip = "AI-Partner-Windows-x64.zip"
          if (Get-Command 7z.exe -ErrorAction SilentlyContinue) {
            7z a -tzip $zip ".\dist\AI智能伴侣" -mx=5 | Out-Null
          } else {
            Compress-Archive -Path ".\dist\AI智能伴侣" -DestinationPath $zip -CompressionLevel Optimal
          }
          Get-Item $zip | Select-Object Name, @{ n = 'SizeMB'; e = { [math]::Round($_.Length / 1MB, 1) } }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Partner-Windows-x64
          path: AI-Partner-Windows-x64.zip
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AI-Partner-Windows-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
