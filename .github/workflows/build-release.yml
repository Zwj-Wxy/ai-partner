name: Build & Release

# 推一个 v 开头的 tag（例如 v1.0.0）就会自动打包并发布 Release。
# 也可以在 Actions 页面手动触发（只产出 artifact，不发布 Release）。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Syntax check
        run: python -m py_compile app.py launcher.py

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean app.spec

      - name: Bundle launchers and docs
        shell: pwsh
        run: |
          Copy-Item packaging\*.bat dist\AI智能伴侣\ -Force
          Copy-Item docs\使用说明.md dist\AI智能伴侣\ -Force
          Get-ChildItem dist\AI智能伴侣 | Select-Object Name, Length

      - name: Create zip
        shell: pwsh
        run: |
          $zip = "AI-Partner-Windows-x64.zip"
          if (Get-Command 7z.exe -ErrorAction SilentlyContinue) {
            7z a -tzip $zip ".\dist\AI智能伴侣" -mx=5 | Out-Null
          } else {
            Compress-Archive -Path ".\dist\AI智能伴侣" -DestinationPath $zip -CompressionLevel Optimal
          }
          Get-Item $zip | Select-Object Name, @{ n = 'SizeMB'; e = { [math]::Round($_.Length / 1MB, 1) } }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Partner-Windows-x64
          path: AI-Partner-Windows-x64.zip
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: AI-Partner-Windows-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
